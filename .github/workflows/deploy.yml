# Builds the static site and publishes it to GitHub Pages on every push to main.
# Repository setting required once: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Failures are repeated as annotations so they show on the run page without opening the log.
      - name: Type check
        run: |
          set -o pipefail
          if ! npm run check 2>&1 | tee check.log; then
            grep -iE "error|cannot|failed" check.log | head -20 | sed 's/^/::error::/'
            exit 1
          fi
      - run: npm run build
        env:
          # e.g. https://user.github.io and /repo-name, so links work under the project path.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
